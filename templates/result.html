<!DOCTYPE html>
<html>
<head>
<title>Result</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: #0f172a;
    color: white;
    padding: 20px;
    animation: fadeIn 1s ease-in;
}

body.light {
    background: #f5f7fb;
    color: black;
}

.card {
    max-width: 900px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 20px #00f7ff;
    animation: slideUp 0.8s ease;
}

.video-container {
    position: relative;
    padding-bottom: 56.25%;
    margin-top: 15px;
}

.video-container iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 10px;
}

.back {
    margin-top: 20px;
    display: inline-block;
    background: #00f7ff;
    padding: 10px;
    border-radius: 8px;
    color: black;
    text-decoration: none;
}

.toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #00f7ff;
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
}
</style>

</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<div class="card">

<h2>{{ topic }}</h2>

<p>{{ explanation }}</p>

<audio controls>
    <source src="{{ url_for('static', filename='output.mp3') }}">
</audio>

<div class="video-container">
    <iframe class="yt"
        src="{{ video | replace('watch?v=', 'embed/') }}?enablejsapi=1"
        allowfullscreen>
    </iframe>
</div>

{% for vid in videos %}
<div class="video-container">
    <iframe class="yt"
        src="{{ vid | replace('watch?v=', 'embed/') }}?enablejsapi=1"
        allowfullscreen>
    </iframe>
</div>
{% endfor %}

<a href="/" class="back">⬅ Back</a>

</div>

<script>
function toggleMode() {
    document.body.classList.toggle("light");
}

const players = document.querySelectorAll(".yt");

function pauseAll() {
    players.forEach((iframe) => {
        iframe.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}', '*'
        );
    });
}

players.forEach((iframe) => {
    iframe.addEventListener("mouseenter", pauseAll);
});
</script>

</body>
</html>
